<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} • Smart Study AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  {{EXTRA_HEAD}}
</head>
<body>
  <div class="ambient-glow"></div>

  <header class="app-nav">
    <div class="nav-container">
      <a href="/" class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Smart Study AI <span class="badge badge-student" style="font-size:0.65rem">v3.0</span></h1>
          <p>Adaptive Exam Timetable Generator</p>
        </div>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="/" class="nav-link">Home</a></li>
          <li><a href="/planner" class="nav-link">AI Planner</a></li>
          <li><a href="/plans" class="nav-link">Saved Plans</a></li>
          <li><a href="/my-data" class="nav-link" id="navMyData">My Account</a></li>
          <li class="admin-nav-link" hidden><a href="/admin" class="nav-link admin-link">🛡️ Admin Panel</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <!-- Theme Toggle -->
        <button type="button" id="themeToggle" class="btn-ghost btn-icon-only" aria-label="Toggle dark/light theme" title="Toggle theme">
          <svg id="themeIconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg id="themeIconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" hidden><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>

        <!-- Logged Out Auth Buttons -->
        <div id="navAuthButtons" style="display:flex;gap:8px;">
          <a href="/login" class="btn btn-ghost">Log In</a>
          <a href="/register" class="btn btn-primary">Sign Up</a>
        </div>

        <!-- Logged In User Dropdown -->
        <div id="navUserMenu" class="user-menu-wrap" hidden>
          <button type="button" id="btnUserDropdown" class="user-pill-btn">
            <span id="navUserAvatar" class="user-avatar-circle">U</span>
            <span id="navUserName" style="font-size:0.85rem;font-weight:700">User</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>

          <div id="userDropdown" class="user-dropdown" hidden>
            <div class="dropdown-user-header">
              <div id="dropdownName" class="dropdown-name">Student User</div>
              <div id="dropdownEmail" class="dropdown-email">user@example.com</div>
              <div id="dropdownRole" style="margin-top:6px">
                <span class="badge badge-student">🎓 Student</span>
              </div>
            </div>
            <a href="/planner" class="dropdown-item">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span>Timetable Planner</span>
            </a>
            <a href="/plans" class="dropdown-item">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              <span>Saved Timetables</span>
            </a>
            <a href="/my-data" class="dropdown-item">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span id="dropdownMyDataLabel">My Account</span>
            </a>
            <a href="/admin" class="dropdown-item admin-nav-link" style="color:#f87171" hidden>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              <span>Admin Operations</span>
            </a>
            <div style="height:1px;background:var(--border);margin:4px 0"></div>
            <button type="button" id="btnLogout" class="dropdown-item text-danger">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              <span>Log Out</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="page-container">
